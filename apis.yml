name: Kanoodle
description: Kanoodle was an online advertising network founded in 1999 by Kent Keating, specializing
  in search-targeted and later content-targeted (contextual) sponsored links, adding partners such as
  CBS MarketWatch in January 2004. In August 2006 it restructured under a new parent company, Seevast
  Corp - the search-advertising business kept the Kanoodle brand, the content-targeted contextual ad
  product was spun out as Pulse 360, and the newly acquired Moniker.com domain registrar ran as a
  separate unit. Listed here as an Insight Partners portfolio company, Kanoodle/Seevast is defunct and
  exposes no surviving public API, developer portal, SDK, or documentation - the seevast.com domain now
  resolves to a parked-domain lander. This profile is retained as a historical portfolio lead.
